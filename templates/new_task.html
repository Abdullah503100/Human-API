<!DOCTYPE html>
<html>
<head>
    <title>Human API - New task</title>
</head>
<body>
    <h1>Human API</h1>
    <p><a href="{{ url_for('home') }}">Home</a> |
       <a href="{{ url_for('logout') }}">Log out</a></p>

    <h2>Submit a new task</h2>

    <form method="post">
        <label>Task title<br>
            <input type="text" name="title" value="{{ title }}" size="60">
        </label>
        {% if errors.title %}<p><strong>{{ errors.title }}</strong></p>{% endif %}
        <br><br>
        <label>Task description (what needs to be done and which skills it needs)<br>
            <textarea name="description" rows="6" cols="60">{{ description }}</textarea>
        </label>
        {% if errors.description %}<p><strong>{{ errors.description }}</strong></p>{% endif %}
        <br><br>
        <button type="submit">Submit task</button>
    </form>
</body>
</html>
